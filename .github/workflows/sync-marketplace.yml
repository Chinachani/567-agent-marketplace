name: Sync & Update 567 Agent Marketplace

on:
  push:
    tags:
      - 'marketplace-v*'
  schedule:
    # Run every day at midnight UTC (08:00 AM Beijing Time)
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Scheduled, manual, and tag-triggered runs all mutate main and catalog.
  # Use one shared lock so two trigger types cannot publish stale catalog state.
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  update-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test marketplace collector
        run: python3 -m unittest discover -s tests -v

      - name: Restore previous discovery catalog state
        run: |
          if git fetch origin refs/heads/catalog:refs/remotes/origin/catalog; then
            if git cat-file -e origin/catalog:catalog-state.json.gz 2>/dev/null; then
              git show origin/catalog:catalog-state.json.gz > .marketplace-state.json.gz
            else
              echo "Catalog branch has no state file; the current main manifest seeds migration state"
            fi
          else
            echo "No previous catalog branch; the current main manifest seeds migration state"
          fi

      - name: Run sync and generate catalog
        env:
          API_567_KEY: ${{ secrets.API_567_KEY }}
          API_567_BASE_URL: ${{ secrets.API_567_BASE_URL }}
          API_567_MODEL: ${{ secrets.API_567_MODEL }}
        run: |
          python3 sync_marketplace.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add marketplace.json .567agent/ .vetta/ skills/ mcps/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(marketplace): 定时同步最新技能与 MCP 清单 [skip ci]"
            git push origin main
          fi

      - name: Publish sharded MCP discovery catalog
        run: |
          test -f catalog-dist/index.json
          if git ls-remote --exit-code --heads origin catalog >/dev/null 2>&1; then
            git fetch origin refs/heads/catalog:refs/remotes/origin/catalog
            git worktree add --detach "$RUNNER_TEMP/marketplace-catalog" refs/remotes/origin/catalog
          else
            git worktree add --orphan -b catalog "$RUNNER_TEMP/marketplace-catalog"
          fi
          find "$RUNNER_TEMP/marketplace-catalog" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a catalog-dist/. "$RUNNER_TEMP/marketplace-catalog/"
          git -C "$RUNNER_TEMP/marketplace-catalog" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/marketplace-catalog" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/marketplace-catalog" add --all
          if git -C "$RUNNER_TEMP/marketplace-catalog" diff --cached --quiet; then
            echo "Discovery catalog did not change"
          else
            git -C "$RUNNER_TEMP/marketplace-catalog" commit -m "chore: publish sharded MCP discovery catalog [skip ci]"
            git -C "$RUNNER_TEMP/marketplace-catalog" push origin HEAD:refs/heads/catalog
          fi
